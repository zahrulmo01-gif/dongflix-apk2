name: Build Dongflix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Cache Dongflix Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: app/dongflix.jks
          key: dongflix-signing-keystore-v1

      - name: Auto-Generate Keystore (First Time Only)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore app/dongflix.jks -storepass dongflix123 -alias dongflix -keypass dongflix123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dongflix, OU=Dev, O=Rulsz, L=ID, S=ID, C=ID"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dongflix-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Kirim ZIP ke Telegram (Sukses)
        if: success()
        run: |
          zip -j Dongflix-Build.zip app/build/outputs/apk/debug/app-debug.apk
          curl -F document=@"Dongflix-Build.zip" \
               -F caption="Build Dongflix berhasil! (Commit: ${{ github.event.head_commit.message }})" \
               "https://api.telegram.org/bot9240189258:AAE8k0uNjJ6QsS_uOga0JEVALb79Taax6yQ/sendDocument?chat_id=1163053213"

      - name: Kirim Notifikasi Error ke Telegram (Gagal)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot9240189258:AAE8k0uNjJ6QsS_uOga0JEVALb79Taax6yQ/sendMessage" \
               -d chat_id="1163053213" \
               -d parse_mode="HTML" \
               -d text="❌ <b>Build Dongflix Gagal!</b>%0A%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<b>Cek Log Error:</b> https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
